# Replace example.org and certificate paths. Expose Node only on 127.0.0.1:3000.
limit_req_zone $binary_remote_addr zone=anna_api:10m rate=30r/m;
# Pages and files: a page load takes ~40 requests, so the burst covers several loads; a flood from one address gets 429.
limit_req_zone $binary_remote_addr zone=anna_pages:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=anna_conn:10m;
limit_conn anna_conn 60;
limit_conn_status 429;
limit_req_status 429;
# Slow or idle clients are dropped early, so they cannot hold connections open.
keepalive_timeout 20s;
send_timeout 15s;
reset_timedout_connection on;
# In nginx.conf as well: server_tokens off; worker_rlimit_nofile 16384; events { worker_connections 4096; }

server {
    listen 80;
    server_name example.org www.example.org;
    return 301 https://example.org$request_uri;
}

# One address for search engines: www redirects to the bare domain.
server {
    listen 443 ssl http2;
    server_name www.example.org;
    ssl_certificate /etc/letsencrypt/live/example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;
    return 301 https://example.org$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.org;
    ssl_certificate /etc/letsencrypt/live/example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;
    # Chat history with detailed answers in Cyrillic can exceed 16 KB.
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    server_tokens off;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Payment notifications: no visitor rate limit (bursts from the provider must not get 429);
    # the app checks the provider's addresses or signature itself.
    location /api/billing/webhook/ {
        client_max_body_size 64k;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://127.0.0.1:3000;
    }

    # Chat answers stream over SSE; buffering would hold them until the end.
    location = /api/chat {
        limit_req zone=anna_api burst=20 nodelay;
        limit_req_status 429;
        proxy_buffering off;
        # Longer than the app's own 45 s model timeout, so the app ends the stream, not nginx.
        proxy_read_timeout 90s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://127.0.0.1:3000;
    }

    location /api/ {
        limit_req zone=anna_api burst=20 nodelay;
        limit_req_status 429;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        limit_req zone=anna_pages burst=300 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://127.0.0.1:3000;
    }
}
